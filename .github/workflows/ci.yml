name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the package (without the renderer) and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: The demo video passes its own depth and teaching checks
        run: unglazed check examples/rectflow
      - name: New video, check, and a silent draft of the narration
        run: |
          unglazed new smoke
          unglazed check smoke
          unglazed voice smoke --estimate
