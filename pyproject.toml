[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unglazed"
version = "0.1.0"
description = "Technical explainer videos for ML papers that do not skip steps: a depth contract, a visual kit on ManimGL, local narration, one command."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "ShadowKingYT444" }]
keywords = ["manim", "explainer", "video", "machine-learning", "papers", "education", "kokoro", "tts"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "av>=12",
    "setuptools<81",
    # ManimGL at the commit this kit is tested with (it renders through wgpu: Vulkan on Linux, Metal on macOS)
    "manimgl @ git+https://github.com/3b1b/manim.git@fafa083a4fb274bba9cabde0b6e2f50ba6da0622",
]

[project.optional-dependencies]
voice = ["kokoro>=0.9.4", "soundfile>=0.12", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
unglazed = "unglazed.cli:main"

[project.urls]
Homepage = "https://github.com/ShadowKingYT444/unglazed"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["unglazed"]

[tool.ruff]
line-length = 180
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501", "E702", "E731", "E741", "F403", "F405", "I001"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["F841"]   # scene code names layout groups it only arranges

[tool.pytest.ini_options]
testpaths = ["tests"]
